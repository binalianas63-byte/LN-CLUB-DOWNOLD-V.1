<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LN CLUB ADMIN</title><style>body{font-family:Arial;background:#f3f4f6;margin:0}header{background:#111827;color:#fff;text-align:center;padding:20px}main{max-width:800px;margin:20px auto;padding:12px}.card{background:#fff;padding:18px;margin:15px 0;border-radius:14px}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #ddd}button{background:#111827;color:#fff;border:0;font-weight:bold}.danger{background:#dc2626}.hidden{display:none}.apk{border:1px solid #ddd;padding:12px;border-radius:10px;margin:10px 0;word-break:break-word}</style></head><body><header><h2>📱 LN CLUB DOWNLOAD</h2>Admin Panel</header><main><section id="login" class="card"><h3>🔐 Admin Login</h3><input id="pw" type="password" placeholder="Admin Password"><button onclick="login()">LOGIN</button><p id="lm"></p></section><section id="panel" class="hidden"><div class="card"><h3>➕ Add APK</h3><input id="name" placeholder="APK Name"><input id="url" placeholder="Direct APK Download Link"><textarea id="desc" placeholder="Description"></textarea><button onclick="add()">➕ ADD APK</button><p id="msg"></p></div><div class="card"><h3>📦 APK List</h3><div id="list"></div></div></section></main><script>let token="";async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw.value})}),d=await r.json();if(!r.ok){lm.textContent="❌ Wrong password";return}token=d.token;login.classList.add("hidden");panel.classList.remove("hidden");load()}async function api(u,o={}){o.headers=Object.assign({"Content-Type":"application/json","x-admin-token":token},o.headers||{});return fetch(u,o)}async function load(){let a=await(await api("/api/apks")).json();list.innerHTML=a.length?a.map(x=>`<div class="apk"><b>📱 ${esc(x.name)}</b><p>${esc(x.description||"")}</p><small>${esc(x.url)}</small><button class="danger" onclick="del('${x.id}')">🗑️ DELETE</button></div>`).join(""):"কোনো APK নেই।"}async function add(){let n=name.value.trim(),u=url.value.trim(),d=desc.value.trim();if(!n||!u){msg.textContent="❌ Name ও link দিন";return}let r=await api("/api/apks",{method:"POST",body:JSON.stringify({name:n,url:u,description:d})});if(r.ok){name.value=url.value=desc.value="";msg.textContent="✅ APK added";load()}else msg.textContent="❌ Error"}async function del(id){if(!confirm("Delete?"))return;await api("/api/apks/"+id,{method:"DELETE"});load()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}</script></body></html>
